version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tapo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tapo
      POSTGRES_PASSWORD: tapo_password   # à changer
      POSTGRES_DB: tapo
    ports:
      - "5432:5432"
    volumes:
      - tapo_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapo"]
      interval: 5s
      timeout: 5s
      retries: 5

  collector:
    build: .
    container_name: tapo_collector
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # Intervalle de collecte en secondes (300 = 5 minutes), modifiable :
    command: ["python", "main.py", "--loop", "300"]

volumes:
  tapo_pgdata: