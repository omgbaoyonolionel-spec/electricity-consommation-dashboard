  - id: ALERTE_P3_TEMPERATURE
    condition: tC > 60 C (sonde Temperature.GetStatus)
    severite: P3_information (P2 si > 70 C)
    calibration_terrain: 54.8 C mesure au premier releve - seuil pose a +5 C de l observe, a affiner avec l historique
    action: consigner ; si recurrent, ventilation du tableau a examiner
