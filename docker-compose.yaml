version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tapo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tapo
      POSTGRES_PASSWORD: tapo_password   # à changer
      POSTGRES_DB: tapo
    ports:
      - "5432:5432"
    volumes:
      - tapo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapo"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    container_name: tapo_migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  collector:
    build: .
    container_name: tapo_collector
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Intervalle de collecte en secondes (300 = 5 minutes), modifiable :
    command: ["python", "-m", "app.main", "--loop", "300"]

volumes:
  tapo_pgdata: